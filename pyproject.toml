[project]
name = "blackjack-trainer"
version = "0.1.0"
description = ""
authors = [{name="jonas.schrage", email="<119843859+joschrag@users.noreply.github.com>"}]
keywords = ["python","dash","blackjack","basic","strategy"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.urls]
repository = "https://github.com/joschrag/blackjack_trainer"


[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.2.2"
matplotlib = "^3.9.0"
plotly = "^5.22.0"
sqlalchemy = "^2.0.30"
pathlib = "^1.0.1"
urllib3 = "^1.9.0"
dash-mantine-components = "0.13.0a2"
dash-iconify = "^0.1.2"
pyyaml = "^6.0.1"
dash = {extras = ["diskcache", "testing"], version = "^3.0.4"}
dash-bootstrap-components = "^2.0.3"


[tool.poetry.group.dev.dependencies]
pytest-repeat = "^0.9.3"
pytest = "^8.2.2"
black = "^24.4.2"
mypy = "^1.10.0"
isort = "^5.13.2"
ipykernel = "^6.29.4"
flake8 = "^7.0.0"
pre-commit = "^3.7.1"
pytest-cov = "^5.0.0"
pydocstyle = "^6.3.0"
pytest-mock = "^3.14.0"
types-pyyaml = "^6.0.12.20240311"
pylint = "^3.3.7"

[tool.poetry.group.older_python_specific.dependencies]
overrides = {version="^7.7.0",markers = "python_version <= '3.11'"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119

[tool.isort]
profile="black"

[tool.pytest.ini_options]
addopts = "-ra -q --webdriver Firefox --headless"
testpaths = [
    "tests",
]