[project]
name = "blackjack-trainer"
version = "0.1.0"
description = ""
authors = [{name="jonas.schrage", email="<119843859+joschrag@users.noreply.github.com>"}]
keywords = ["python","dash","blackjack","basic","strategy"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dash-bootstrap-components>=2.0.4",
    "dash-iconify>=0.1.2",
    "dash-mantine-components>=2.2.1",
    "dash[diskcache,testing]>=3.2.0",
    "orjson>=3.11.3",
    "pandas>=2.3.2",
    "pathlib>=1.0.1",
    "plotly>=6.3.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.43",
    "urllib3>=1.26.20",
]

[project.urls]
repository = "https://github.com/joschrag/blackjack_trainer"


[project.optional-dependencies]
dev = [
    "pytest-repeat>=0.9.3",
    "pytest>=8.2.2",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "isort>=5.13.2",
    "ipykernel>=6.29.4",
    "flake8>=7.0.0",
    "pre-commit>=3.7.1",
    "pytest-cov>=5.0.0",
    "pydocstyle>=6.3.0",
    "pytest-mock>=3.14.0",
    "types-pyyaml>=6.0.12.20240311",
    "ruff>=0.12.10",
]

older-python-specific = [
    'overrides>=7.7.0; python_version <= "3.11"'
]

[build-system]
requires = ["uv_build >= 0.7.19, <0.9.0"]
build-backend = "uv_build"

[tool.black]
line-length = 119

[tool.isort]
profile="black"

[tool.pytest.ini_options]
addopts = "-ra -q --webdriver Firefox --headless"
testpaths = [
    "tests",
]
